{% extends "base.html" %}
{% block title %}Редактирование вопроса{% endblock %}
{% block content %}
<div class="panel form-panel">
    <h1 class="page-title">Редактирование вопроса</h1>
    <form method="post" class="suggest-form">
        <label>
            Вопрос
            <textarea name="question" rows="2" required>{{ q.question }}</textarea>
        </label>
        {% set correct_set = q.correct_options.split(',') %}
        {% for letter in ['a','b','c'] %}
        <label>
            Вариант {{ letter|upper }}
            <div class="option-input-row">
                <input type="text" name="option_{{ letter }}"
                       value="{{ q['option_' ~ letter] }}" required>
                <label class="checkbox-label">
                    <input type="checkbox" name="correct" value="{{ letter }}"
                        {% if letter in correct_set %}checked{% endif %}>
                    Правильный
                </label>
            </div>
        </label>
        {% endfor %}
        <label>
            Вариант D (необязательно)
            <div class="option-input-row">
                <input type="text" name="option_d" value="{{ q.option_d or '' }}">
                <label class="checkbox-label">
                    <input type="checkbox" name="correct" value="d"
                        {% if 'd' in correct_set %}checked{% endif %}>
                    Правильный
                </label>
            </div>
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
