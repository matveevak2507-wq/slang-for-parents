{% extends "base.html" %}
{% block title %}Новое задание с пропуском{% endblock %}
{% block content %}
<div class="panel form-panel">
    <h1 class="page-title">Новое задание с пропуском</h1>
    <form method="post" class="suggest-form">
        <label>
            Предложение (используйте ____ для пропуска)
            <textarea name="sentence" rows="3" required
                placeholder="Он такой ____ , я не могу перестать о нём думать."></textarea>
        </label>
        <label>
            Правильный ответ
            <input type="text" name="correct_answer" required>
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Добавить</button>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
